<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Flashcards</title>
<style>
:root{--bg:#f5f5f0;--card:#fff;--ink:#1f2937;--muted:#6b7280;--accent:#2563eb;--good:#16a34a;--hard:#ea580c;--again:#dc2626;--border:#e5e7eb;--radius:16px}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:20px}
header{width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:1.4rem;font-weight:700}
.stats{font-size:.85rem;color:var(--muted)}
.deck-filter{margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap}
.deck-filter button{padding:4px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.8rem}
.deck-filter button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card-container{width:100%;max-width:600px;perspective:1000px}
.card{position:relative;width:100%;min-height:300px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,.06);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:40px;text-align:center;font-size:1.2rem;line-height:1.6;transition:transform .4s;transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px;backface-visibility:hidden;border-radius:var(--radius)}
.card-back{transform:rotateY(180deg);background:#fafafa;border-radius:var(--radius)}
.card-label{position:absolute;top:16px;left:20px;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.buttons{width:100%;max-width:600px;display:flex;gap:12px;margin-top:20px}
.buttons button{flex:1;padding:14px;border:none;border-radius:12px;font-size:.9rem;font-weight:600;cursor:pointer;color:#fff;transition:opacity .2s}
.buttons button:active{opacity:.7}
.btn-again{background:var(--again)}
.btn-hard{background:var(--hard)}
.btn-good{background:var(--good)}
.btn-easy{background:var(--accent)}
.empty{text-align:center;color:var(--muted);margin-top:80px;font-size:1.1rem}
.progress{width:100%;max-width:600px;height:4px;background:var(--border);border-radius:2px;margin-bottom:16px;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);transition:width .3s}
.tag{display:inline-block;background:#eef4ff;color:var(--accent);padding:2px 8px;border-radius:6px;font-size:.7rem;margin:2px}
</style>
</head>
<body>
<header>
  <h1>Flashcards</h1>
  <div class="stats" id="stats"></div>
</header>
<div class="deck-filter" id="deckFilter"></div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="card-container">
  <div class="card" id="card" onclick="flip()">
    <div class="card-face" id="front"></div>
    <div class="card-face card-back" id="back"></div>
  </div>
</div>
<div class="buttons" id="buttons" style="display:none">
  <button class="btn-again" onclick="answer(0)">Again</button>
  <button class="btn-hard" onclick="answer(3)">Hard</button>
  <button class="btn-good" onclick="answer(4)">Good</button>
  <button class="btn-easy" onclick="answer(5)">Easy</button>
</div>
<div class="empty" id="empty" style="display:none">
  오늘 복습할 카드가 없습니다 🎉
</div>

<script>
// ── SM-2 구현 ──
const STORAGE_KEY = 'flashcard-sm2-state';
let allCards = [];
let queue = [];
let currentCard = null;
let currentDeck = null;

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveState(state) { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function sm2(item, grade) {
  // grade: 0=again, 3=hard, 4=good, 5=easy
  let { ef, interval, repetition } = item;
  if (grade < 3) {
    repetition = 0;
    interval = 1;
  } else {
    if (repetition === 0) interval = 1;
    else if (repetition === 1) interval = 6;
    else interval = Math.round(interval * ef);
    repetition++;
  }
  ef = Math.max(1.3, ef + (0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02)));
  const due = Date.now() + interval * 86400000;
  return { ef, interval, repetition, due };
}

function getCardState(state, id) {
  return state[id] || { ef: 2.5, interval: 0, repetition: 0, due: 0 };
}

function isDue(state, id) {
  const s = getCardState(state, id);
  return s.due <= Date.now();
}

// ── UI ──
async function init() {
  const resp = await fetch('cards.json');
  allCards = await resp.json();
  renderDecks();
  buildQueue();
  showNext();
}

function renderDecks() {
  const decks = [...new Set(allCards.map(c => c.deck))];
  const el = document.getElementById('deckFilter');
  el.innerHTML = `<button class="${!currentDeck ? 'active' : ''}" onclick="filterDeck(null)">전체</button>` +
    decks.map(d => `<button class="${currentDeck === d ? 'active' : ''}" onclick="filterDeck('${d}')">${d}</button>`).join('');
}

function filterDeck(deck) {
  currentDeck = deck;
  renderDecks();
  buildQueue();
  showNext();
}

function buildQueue() {
  const state = loadState();
  const pool = currentDeck ? allCards.filter(c => c.deck === currentDeck) : allCards;
  queue = pool.filter(c => isDue(state, c.id));
  // 새 카드 + due 카드 섞기
  queue.sort(() => Math.random() - 0.5);
  updateStats();
}

function updateStats() {
  const state = loadState();
  const total = allCards.length;
  const reviewed = Object.keys(state).length;
  const due = allCards.filter(c => isDue(state, c.id)).length;
  document.getElementById('stats').textContent = `${due}장 남음 / 총 ${total}장`;
  const done = total > 0 ? ((total - due) / total) * 100 : 0;
  document.getElementById('progressBar').style.width = done + '%';
}

function showNext() {
  const card = document.getElementById('card');
  const buttons = document.getElementById('buttons');
  const empty = document.getElementById('empty');
  card.classList.remove('flipped');

  if (queue.length === 0) {
    card.style.display = 'none';
    buttons.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  card.style.display = 'flex';
  empty.style.display = 'none';
  buttons.style.display = 'none';
  currentCard = queue.shift();

  const tags = (currentCard.tags || []).map(t => `<span class="tag">${t}</span>`).join(' ');
  document.getElementById('front').innerHTML =
    `<span class="card-label">Q · ${currentCard.deck}</span><div>${currentCard.front}<br/>${tags}</div>`;
  document.getElementById('back').innerHTML =
    `<span class="card-label">A</span><div>${currentCard.back}</div>`;
}

function flip() {
  const card = document.getElementById('card');
  if (!card.classList.contains('flipped')) {
    card.classList.add('flipped');
    document.getElementById('buttons').style.display = 'flex';
  }
}

function answer(grade) {
  if (!currentCard) return;
  const state = loadState();
  const prev = getCardState(state, currentCard.id);
  state[currentCard.id] = sm2(prev, grade);
  saveState(state);

  if (grade < 3) queue.push(currentCard); // again → 큐 뒤로
  updateStats();
  showNext();
}

init();
</script>
</body>
</html>
